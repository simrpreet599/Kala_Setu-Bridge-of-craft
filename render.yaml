# Render Blueprint (optional). Free plan: data is NOT persistent (resets on redeploy/restart).
services:
  - type: web
    name: kalasetu
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --workers 1 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SECRET_KEY
        generateValue: true
      - key: SEED_DEMO
        value: "1"
